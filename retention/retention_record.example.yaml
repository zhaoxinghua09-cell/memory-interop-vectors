# Retention Record — worked instance for catalogue item 6
# "Retention (Xinghua, 22 October)" — W3C Agent Memory Interop use-case catalogue.
#
# This is the concrete record behind the short follow-up/correction email.
# It shows what "the same record, served years later" must carry, and it
# marks which leg is inside the charter's §3 crosswalk and which is not.
# It is machine-checkable by check_retention.py.

record:
  id: "retention-item6-demo"
  title: "Retention — and what the same record has to mean at the end of it"
  catalogue_entry: "6. Retention (Xinghua, 22 October)"
  event_date: "2026-03-18"                 # the day the record was written
  serving_year: 7                          # inspector arrives in year seven

  # 1. Identity over time (LGD-I)
  identity:
    owner: "manufacturer-operator"
    revision: "r3"                         # explicit revision identity, not only a timestamp
    revision_of: "retention-item6-demo"
    current_as_of: "2026-03-18"

  # 2. Change-identifiability (a correction is visible; prior value recoverable)
  changes:
    - at: "2026-05-02"
      by: "regulatory-officer"
      authority: "ISO 13485 4.2.4 (document control), incorporated via 21 CFR 820.10 (former QSR §820.40 is reserved under QMSR)"
      field: "retention_period_us"
      prior_value: "cited as 21 CFR 820.35 with incorporated ISO 13485"
      current_value: "21 CFR Part 820 incorporating ISO 13485 Cl. 4.2.5 (the retention provision that supersedes the prior QSR record-retention rule)"

  # 3. Authority — who approved it, not merely who touched it
  approval:
    approved_by: "quality-manager"
    on: "2026-03-18"
    basis: "MDR 2017/745 Art. 10; 21 CFR Part 820"

  # 4. Retention legs — the period the record must exist.
  #    Both legs are NOT explicitly named in the §3 crosswalk; the Chair
  #    reaches them via the broad "comparable regimes" reading.
  retention:
    in_charter_section_3: false
    legs:
      - regime: "EU MDR 2017/745 Article 10(8)"
        obligation: "technical documentation available to competent authorities"
        minimum_years: 10                 # after last device placed on market
        implantable_years: 15
        in_charter_section_3: false
      - regime: "US QMSR: 21 CFR Part 820 incorporating ISO 13485 Clause 4.2.5"
        obligation: "records retention; §820.35 is record control, not the period"
        minimum_years: 2                  # not less than 2 yrs from device release; at least device lifetime (ISO 13485 4.2.5)
        prior_rule: "the prior QSR record-retention rule"
        in_charter_section_3: false

  # 5. Erasure boundary — GDPR Art. 17(3)(b) IS named in §3 (inside).
  erasure:
    in_charter_section_3: true
    regime: "GDPR Article 17(3)(b)"
    effect: "right to erasure disapplied to the extent processing is necessary for a legal obligation"
    store_must_show: "what it kept is what the obligation covers; what it removed is outside it"

  # 6. Retrievability on demand
  retrievability:
    produced_without_reconstruction: true
    survives: ["agent upgrade", "store migration", "format revision"]
